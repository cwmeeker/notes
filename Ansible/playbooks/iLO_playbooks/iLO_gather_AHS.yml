---

- hosts: all
  gather_facts: no

  tasks:

    - name: Gather subsets of Ansible facts
      ansible.builtin.setup:
        gather_subset:
          - env
      delegate_to: localhost
      run_once: yes

    - name: Gather the AHS log(s)
      uri:
        # headers:
        #   Content-Type: "application/json"
        user: "{{ ilo_username }}"
        password: "{{ ilo_password }}"
        url: "https://{{ ilo_ipv4 }}/ahsdata/ahs.ahs?days=7"
        dest: "/tmp/{{ inventory_hostname }}.bin"
        force_basic_auth: yes
        validate_certs: no
      delegate_to: localhost

    - name: Copy file to web
      copy:
        src: "/tmp/{{ inventory_hostname }}.bin"
        dest: "/usr/share/nginx/html/AHS_logs/{{ inventory_hostname }}_{{ ansible_date_time.iso8601_basic_short }}.ahs"
      become: yes
      delegate_to: localhost
