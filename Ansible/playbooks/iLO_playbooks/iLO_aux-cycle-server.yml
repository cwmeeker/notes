---

- hosts: all
  gather_facts: no

  tasks:

    - name: Create a Session on the iLO
      uri:
        url: "https://{{ ilo_ipv4 }}/redfish/v1/SessionService/Sessions"
        method: POST
        body: |
          {
            "UserName": "{{ ilo_username }}",
            "Password": "{{ ilo_password }}"
          }
        body_format: json
        validate_certs: no
        # force_basic_auth: yes
      register: login_response
      delegate_to: localhost
      failed_when: login_response.status != 201
      ignore_errors: yes
      no_log: true

    - name: Push auxcycle XML file to the server
      uri:
        method: POST
        headers:
          Content-Type: "application/json"
          X-Auth-Token: "{{ login_response.x_auth_token }}"
        # user: "{{ ilo_username }}"
        # password: "{{ ilo_password }}"
        url: "https://{{ ilo_ipv4 }}/redfish/v1/Systems/1/Actions/Oem/Hpe/HpeComputerSystemExt.SystemReset/"
        # force_basic_auth: yes
        validate_certs: no
        body_format: json
        body: |
          {
            "Action": "SystemReset",
            "ResetType": "AuxCycle"
          }
      delegate_to: localhost
      no_log: true

    - name: Reboot the server to initiate the auxcycle
      uri:
        url: "https://{{ ilo_ipv4 }}/redfish/v1/Systems/1/Actions/ComputerSystem.Reset"
        method: POST
        headers:
          X-Auth-Token: "{{ login_response.x_auth_token }}"
        body: |
          {
            "ResetType": "ForceRestart"
          }
        body_format: json
        validate_certs: no
      delegate_to: localhost
      when: server_reboot