---
- name: Auxiliary power cycle server via HPE iLO
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ilo_base_url: "https://{{ ilo_ip }}"
    auxcycle_uri: >-
      {{ ilo_base_url }}/redfish/v1/Systems/1/Actions/Oem/Hpe/HpeComputerSystemExt.SystemReset/

  tasks:
    - name: Trigger auxiliary power cycle
      ansible.builtin.uri:
        url: "{{ auxcycle_uri }}"
        method: POST
        user: "{{ ilo_username }}"
        password: "{{ ilo_password }}"
        force_basic_auth: true
        validate_certs: true
        headers:
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          {"ResetType": "AuxCycle"}
        status_code:
          - 200
          - 202
          - 204
        return_content: true
      register: auxcycle_result
      no_log: true

    - name: Report request submission
      ansible.builtin.debug:
        msg: >-
          Auxiliary power-cycle request accepted by iLO
          for {{ ilo_host }}. HTTP status:
          {{ auxcycle_result.status }}.
