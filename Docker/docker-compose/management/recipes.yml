version: "3.1"
services:
  mealie:
    container_name: mealie
    image: hkotel/mealie:latest
    restart: always
    ports:
      - 9925:9000
    environment:
      PUID: 1002
      PGID: 1005
      TZ: America/New_York
      BASE_URL: "http://192.168.1.202"
    volumes:
      - /home/docker_vols/mealie:/app/data