version: '3'
services:
  homeassistant:
    container_name: hass
    image: "homeassistant/home-assistant:latest"
#    image: "homeassistant/home-assistant:2025.4.0"
    volumes:
      - /home/docker_vols/hass/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host