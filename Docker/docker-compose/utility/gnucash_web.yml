services:
  db:
    image: postgres:16
    restart: on-failure
    container_name: gnucash-db
    environment:
      POSTGRES_USER: 'u_gnucash'
      POSTGRES_DB: 'gnucash'
      POSTGRES_PASSWORD: '64166416@Rxu'
      TZ: 'America/New_York'
    volumes:
      - /home/docker_vols/gnucash-web/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
      
  app:
    image: ghcr.io/joshuabach/gnucash-web:main
    # image: ghcr.io/cwmeeker/gnucash-web:latest
    restart: on-failure
    container_name: gnucash-app
    environment:
      SECRET_KEY: 'e317b4eddca81a11a3b840a1d821bb1008aafaf73ccdbcd959f3f5c6768505c5'
      LOG_LEVEL: 'DEBUG'
      DB_DRIVER: 'postgresql'
      DB_NAME: 'gnucash'
      DB_HOST: 'db'
      AUTH_MECHANISM: 'passthrough'
      TZ: 'America/New_York'
      TRANSACTION_PAGE_LENGTH: 25
      PRESELECTED_CONTRA_ACCOUNT:
    ports:
      - "8043:8000"