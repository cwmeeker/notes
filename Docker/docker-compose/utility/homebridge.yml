version: '2'
services:
  homebridge:
    container_name: homebridge
    image: homebridge/homebridge:latest
    cap_add:
      - SYS_TIME
      - SYS_NICE
    restart: unless-stopped
    network_mode: host
    volumes:
      - /home/docker_vols/homebridge:/homebridge
      - /etc/localtime:/etc/localtime:ro
    environment:
      - "TZ=America/New_York"
    logging:
      driver: json-file
      options:
        max-size: "10mb"
        max-file: "1"