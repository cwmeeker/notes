services:
  idle-breakout:
    image: ghcr.io/<your-github-username>/idle-breakout:latest
    container_name: idle-breakout
    restart: unless-stopped
    ports:
      - "8088:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE