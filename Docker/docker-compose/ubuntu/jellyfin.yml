version: "3.3"
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - JELLYFIN_PublishedServerUrl=media.meeker.local #optional
    volumes:
      - /home/docker_vols/jellyfin/config:/config
      - /mnt/external-drive-3T/jellyfin/Media/TV:/data/tvshows
      - /mnt/external-drive-3T/jellyfin/Media/Movies:/data/movies
      - /mnt/external-drive-3T/jellyfin/Media/Music:/data/music
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
    restart: unless-stopped