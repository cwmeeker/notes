services:
  rachel-webpage:
    container_name: rachel-webpage
    hostname: rachel.meeker-online.net
    image: httpd:latest
    environment:
      - TZ=America/New_York
    volumes:
      - /home/docker_vols/httpd/rachel-webpage/www:/usr/local/apache2/htdocs/
    ports:
      - 9088:80
    restart: unless-stopped