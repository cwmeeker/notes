version: '3.3'

services:
  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8080
    volumes:
      - /home/docker_vols/qbittorrent/config:/config
      - /mnt/external-drive-3T/qbittorrent/Downloads:/downloads
    ports:
      - 8080:8080/tcp
      - 6881:6881/tcp
      - 6881:6881/udp